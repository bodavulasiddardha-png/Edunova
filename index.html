<title>Edunova Consultancy – Your Future Starts Here</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --cream: #fdf8ee;
    --cream-dark: #f7efda;
    --cream-deeper: #f0e4c4;
    --gold: #c8860a;
    --gold-light: #f0a500;
    --gold-pale: #fde8a0;
    --gold-vivid: #ffbe18;
    --navy: #1a1a2e;
    --text-dark: #1a1000;
    --text-mid: #3d2e00;
    --text-muted: #7a6a40;
    --white: #ffffff;
    --border: rgba(200,134,10,0.22);
    --border-dark: rgba(200,134,10,0.4);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    overflow-x: hidden;
  }

  /* ══ NAV ══ */
  nav {
    position: fixed;
    top:0; left:0; right:0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 3rem;
    background: rgba(10,6,0,0.97);
    backdrop-filter: blur(16px);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    text-decoration: none;
  }

  .logo-mark {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #c8860a, #ffbe18);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem; font-weight: 700;
    color: #1a1200;
  }

  .logo-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem; font-weight: 700;
    color: var(--white); letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .logo-text span { color: var(--gold-light); }

  .nav-right {
    display: flex; align-items: center; gap: 1rem;
  }

  .nav-links {
    display: flex; align-items: center; gap: 2rem; list-style: none;
  }

  .nav-links a {
    text-decoration: none; color: rgba(255,255,255,0.65);
    font-size: 0.82rem; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    transition: color 0.25s;
  }

  .nav-links a:hover { color: var(--gold-light); }

  .nav-wa {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: #25d366; color: white;
    font-size: 0.85rem; font-weight: 600;
    padding: 0.55rem 1.2rem; border-radius: 6px;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .nav-wa:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(37,211,102,0.35); }

  /* ══ HERO ══ */
  #home {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* Real students/library background */
  .hero-img {
    position: absolute;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?w=1800&q=85');
    background-size: cover;
    background-position: center 35%;
    background-repeat: no-repeat;
  }

  /* Layered overlays — left side dark for text, right side lighter */
  .hero-img::after {
    content: '';
    position: absolute; inset: 0;
    background:
      linear-gradient(105deg,
        rgba(12,8,0,0.92) 0%,
        rgba(20,12,0,0.76) 45%,
        rgba(20,12,0,0.42) 70%,
        rgba(20,12,0,0.18) 100%
      ),
      linear-gradient(180deg,
        rgba(12,8,0,0.45) 0%,
        rgba(12,8,0,0.08) 40%,
        rgba(12,8,0,0.55) 100%
      );
  }

  /* Subtle gold vignette at bottom */
  .hero-img::before {
    content: '';
    position: absolute; inset: 0; z-index: 1;
    background: linear-gradient(0deg, rgba(200,134,10,0.22) 0%, transparent 45%);
  }

  .hero-inner {
    position: relative; z-index: 2;
    padding: 9rem 3.5rem 5rem;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
  }

  /* LEFT — text content */
  .hero-left { max-width: 680px; }

  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: rgba(184,146,42,0.15);
    border: 1px solid rgba(184,146,42,0.35);
    border-radius: 100px;
    padding: 0.35rem 1rem;
    font-size: 0.72rem; font-weight: 600;
    color: var(--gold-pale);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin-bottom: 1.8rem;
    animation: fadeUp 0.7s ease both;
  }

  h1.hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.8rem, 5.5vw, 5rem);
    font-weight: 700;
    color: var(--white);
    line-height: 1.06;
    letter-spacing: -0.02em;
    margin-bottom: 1.4rem;
    animation: fadeUp 0.7s 0.1s ease both;
  }

  h1.hero-title .gold-text { color: var(--gold-light); }

  .hero-desc {
    font-size: 1.05rem; color: rgba(255,255,255,0.72);
    line-height: 1.75; max-width: 480px;
    margin-bottom: 2.2rem;
    animation: fadeUp 0.7s 0.2s ease both;
  }

  .hero-btns {
    display: flex; gap: 1rem; flex-wrap: wrap;
    animation: fadeUp 0.7s 0.3s ease both;
  }

  .btn-gold {
    display: inline-flex; align-items: center; gap: 0.45rem;
    background: linear-gradient(135deg, #c8860a, #ffbe18);
    color: #1a0f00; font-weight: 700; font-size: 0.92rem;
    padding: 0.85rem 1.8rem; border-radius: 7px;
    text-decoration: none; border: none; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    font-family: 'Poppins', sans-serif;
  }

  .btn-gold:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 28px rgba(255,190,24,0.55);
  }

  .btn-ghost {
    display: inline-flex; align-items: center; gap: 0.45rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--white); font-weight: 500; font-size: 0.92rem;
    padding: 0.85rem 1.8rem; border-radius: 7px;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
  }

  .btn-ghost:hover {
    background: rgba(255,255,255,0.14);
    border-color: var(--gold-light);
  }

  /* ── Hero Trust Pills ── */
  .hero-pills {
    display: flex; flex-wrap: wrap; gap: 0.6rem;
    margin-top: 2rem;
    animation: fadeUp 0.7s 0.4s ease both;
  }

  .hero-pill {
    display: flex; align-items: center; gap: 0.4rem;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(184,146,42,0.25);
    border-radius: 100px;
    padding: 0.35rem 0.85rem;
    font-size: 0.78rem; color: rgba(255,255,255,0.8);
  }

  .hero-pill span { color: var(--gold-light); font-weight: 700; }





  /* ══ STATS TICKER ══ */
  .stats-ticker {
    background: linear-gradient(135deg, #c8860a, #ffbe18);
    padding: 0;
    overflow: hidden;
    position: relative;
    z-index: 2;
  }

  .ticker-track {
    display: flex;
    white-space: nowrap;
    animation: tickerScroll 28s linear infinite;
    width: max-content;
  }

  .ticker-track:hover { animation-play-state: paused; }

  @keyframes tickerScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .ticker-item {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.9rem 2.5rem;
    font-size: 0.78rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: #1a0f00; border-right: 1px solid rgba(0,0,0,0.12);
    flex-shrink: 0;
  }

  .ticker-item strong { font-size: 1.1rem; font-family: 'Cormorant Garamond', serif; }

  .ticker-highlight {
    background: rgba(0,0,0,0.15);
    border-radius: 4px;
    padding: 0.1rem 0.6rem;
  }

  /* ══ STATS GRID (after ticker) ══ */
  .stats-section {
    background: #100900;
    padding: 3.5rem;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border-bottom: 1px solid rgba(200,134,10,0.25);
  }

  .stat-box {
    text-align: center;
    padding: 1.5rem 1rem;
    border-right: 1px solid rgba(184,146,42,0.12);
  }

  .stat-box:last-child { border-right: none; }

  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 3.2rem; font-weight: 700;
    color: var(--gold-light); line-height: 1;
    display: block;
  }

  .stat-lbl {
    font-size: 0.72rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: rgba(255,255,255,0.45);
    margin-top: 0.4rem; display: block;
  }

  /* ══ WHY EDUNOVA ══ */
  #about {
    background: var(--cream);
    padding: 6rem 3.5rem;
  }

  .section-eyebrow {
    display: inline-flex; align-items: center; gap: 0.6rem;
    font-size: 0.72rem; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--gold);
    font-weight: 700; margin-bottom: 1rem;
  }

  .section-eyebrow::before {
    content: ''; width: 28px; height: 1.5px;
    background: var(--gold); opacity: 0.6;
  }

  h2.section-h {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 700; line-height: 1.15;
    color: var(--text-dark); margin-bottom: 0.8rem;
  }

  .section-sub {
    font-size: 0.98rem; color: var(--text-muted);
    line-height: 1.7; max-width: 500px;
    margin-bottom: 3rem;
  }

  .why-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.2rem;
  }

  .why-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 1.8rem;
    transition: box-shadow 0.3s, transform 0.3s, border-color 0.3s;
  }

  .why-card:hover {
    transform: translateY(-5px);
    border-color: var(--gold);
    box-shadow: 0 12px 32px rgba(200,134,10,0.2);
  }

  .why-icon {
    width: 52px; height: 52px;
    background: var(--cream);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem; margin-bottom: 1.1rem;
  }

  .why-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem; font-weight: 600;
    color: var(--text-dark); margin-bottom: 0.5rem;
  }

  .why-desc {
    font-size: 0.88rem; color: var(--text-muted); line-height: 1.65;
  }

  /* ══ COLLEGES ══ */
  #colleges {
    background: var(--cream-dark);
    padding: 6rem 3.5rem;
  }

  .state-tabs {
    display: flex; gap: 0.5rem; flex-wrap: wrap;
    margin: 1.5rem 0 2rem;
  }

  .tab-btn {
    padding: 0.5rem 1.1rem; border-radius: 100px;
    border: 1.5px solid var(--border-dark);
    background: transparent; color: var(--text-mid);
    font-size: 0.83rem; cursor: pointer;
    transition: all 0.22s;
    font-family: 'Poppins', sans-serif;
  }

  .tab-btn:hover, .tab-btn.active {
    background: var(--gold);
    color: #1a0f00; border-color: var(--gold);
    font-weight: 700;
  }

  .colleges-panel { display: none; }
  .colleges-panel.active { display: block; }

  .colleges-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 0.85rem;
  }

  .college-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 0.9rem 1.1rem;
    display: flex; align-items: center; gap: 0.65rem;
    font-size: 0.86rem; color: var(--text-mid);
    transition: border-color 0.22s, color 0.22s, box-shadow 0.22s;
  }

  .college-card:hover {
    border-color: var(--gold); color: var(--text-dark);
    box-shadow: 0 4px 14px rgba(184,146,42,0.1);
  }

  .college-card::before { content: '🏛'; font-size: 1rem; flex-shrink: 0; }

  /* ══ PROCESS ══ */
  #process {
    background: var(--navy); padding: 6rem 3.5rem;
  }

  #process .section-eyebrow { color: var(--gold-light); }
  #process .section-eyebrow::before { background: var(--gold-light); }
  #process h2.section-h { color: var(--white); }
  #process .section-sub { color: rgba(255,255,255,0.5); }

  .steps-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1.5rem; margin-top: 3rem; position: relative;
  }

  .steps-row::after {
    content: '';
    position: absolute; top: 2.2rem; left: 12.5%; right: 12.5%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(184,146,42,0.4), transparent);
  }

  .step-card {
    text-align: center; padding: 0 1rem; position: relative; z-index: 1;
  }

  .step-num {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #c8860a, #ffbe18);
    border-radius: 50%; margin: 0 auto 1.4rem;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem; font-weight: 700; color: #1a0f00;
  }

  .step-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem; font-weight: 600;
    color: var(--gold-light); margin-bottom: 0.5rem;
  }

  .step-desc {
    font-size: 0.84rem; color: rgba(255,255,255,0.5); line-height: 1.6;
  }

  /* ══ GET IN TOUCH ══ */
  #contact {
    background: var(--cream);
    padding: 6rem 3.5rem;
  }

  .contact-wrap {
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 4rem; align-items: start;
    margin-top: 2.5rem;
  }

  .contact-left h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem; font-weight: 700;
    color: var(--text-dark); margin-bottom: 0.8rem;
    line-height: 1.2;
  }

  .contact-left p {
    font-size: 0.95rem; color: var(--text-muted);
    line-height: 1.75; margin-bottom: 2rem;
  }

  .contact-items { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }

  .c-item {
    display: flex; align-items: flex-start; gap: 1rem;
  }

  .c-item-icon {
    width: 42px; height: 42px;
    background: var(--cream-dark);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; flex-shrink: 0;
  }

  .c-item-text strong {
    display: block; font-size: 0.9rem;
    color: var(--text-dark); font-weight: 600;
  }

  .c-item-text span {
    font-size: 0.82rem; color: var(--text-muted);
  }

  .btn-wa-big {
    display: inline-flex; align-items: center; gap: 0.6rem;
    background: #25d366; color: white;
    font-size: 0.95rem; font-weight: 700;
    padding: 1rem 2rem; border-radius: 8px;
    text-decoration: none; width: 100%; justify-content: center;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .btn-wa-big:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(37,211,102,0.45);
  }

  /* Contact Form */
  .enquiry-box {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 2.2rem;
    box-shadow: 0 4px 24px rgba(184,146,42,0.08);
  }

  .enq-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; font-weight: 700;
    color: var(--text-dark); margin-bottom: 0.3rem;
  }

  .enq-sub {
    font-size: 0.83rem; color: var(--text-muted); margin-bottom: 1.5rem;
  }

  .form-section-lbl {
    font-size: 0.7rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold);
    font-weight: 700; margin: 1.2rem 0 0.8rem;
    display: flex; align-items: center; gap: 0.4rem;
  }

  .f-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }

  .f-group {
    display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.85rem;
  }

  .f-group label {
    font-size: 0.78rem; color: var(--text-mid); font-weight: 500;
  }

  .f-group input, .f-group select, .f-group textarea {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 7px; padding: 0.62rem 0.9rem;
    color: var(--text-dark);
    font-family: 'Poppins', sans-serif; font-size: 0.88rem;
    outline: none; transition: border-color 0.2s;
    width: 100%;
  }

  .f-group input:focus, .f-group select:focus, .f-group textarea:focus {
    border-color: var(--gold);
  }

  .f-group textarea { resize: vertical; min-height: 75px; }

  .cb-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.85rem; }

  .cb-item {
    display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.84rem; color: var(--text-mid); cursor: pointer;
  }

  .btn-enq-submit {
    width: 100%; padding: 0.95rem;
    background: linear-gradient(135deg, #c8860a, #ffbe18);
    color: #1a0f00; font-weight: 700; font-size: 0.95rem;
    border: none; border-radius: 8px; cursor: pointer;
    font-family: 'Poppins', sans-serif;
    transition: transform 0.2s, box-shadow 0.2s; margin-top: 0.5rem;
  }

  .btn-enq-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(255,190,24,0.45);
  }

  .enq-success {
    display: none; text-align: center; padding: 2rem;
  }

  .enq-success .s-circle {
    width: 58px; height: 58px;
    background: linear-gradient(135deg, #c8860a, #ffbe18);
    border-radius: 50%; margin: 0 auto 1rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
  }

  .enq-success h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.5rem; color: var(--text-dark); margin-bottom: 0.4rem;
  }

  .enq-success p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.6; }

  /* ══ FOOTER ══ */
  footer {
    background: #080500;
    padding: 3.5rem 3.5rem 1.5rem;
  }

  .footer-top {
    display: grid; grid-template-columns: 2fr 1fr 1fr;
    gap: 3rem; padding-bottom: 2.5rem;
    border-bottom: 1px solid rgba(184,146,42,0.12);
    margin-bottom: 1.5rem;
  }

  .footer-brand p {
    font-size: 0.86rem; color: rgba(255,255,255,0.45);
    line-height: 1.7; margin: 0.8rem 0 1.2rem;
    max-width: 280px;
  }

  .footer-links-col { list-style: none; }
  .footer-links-col h4 {
    font-size: 0.72rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold-light);
    font-weight: 700; margin-bottom: 1rem;
  }

  .footer-links-col ul { list-style: none; display: flex; flex-direction: column; gap: 0.55rem; }

  .footer-links-col ul a {
    font-size: 0.85rem; color: rgba(255,255,255,0.45);
    text-decoration: none; transition: color 0.2s;
  }

  .footer-links-col ul a:hover { color: var(--gold-light); }

  .footer-contact-list { display: flex; flex-direction: column; gap: 0.5rem; }

  .footer-contact-list a {
    font-size: 0.84rem; color: rgba(255,255,255,0.45);
    text-decoration: none; transition: color 0.2s;
  }

  .footer-contact-list a:hover { color: var(--gold-light); }

  .footer-bottom {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 0.78rem; color: rgba(255,255,255,0.3);
  }

  .footer-bottom span { color: var(--gold-light); }

  /* ══ WA FLOAT ══ */
  .wa-fab {
    position: fixed; bottom: 1.8rem; right: 1.8rem; z-index: 200;
    width: 54px; height: 54px;
    background: #25d366; color: white;
    border-radius: 50%; text-decoration: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    box-shadow: 0 6px 20px rgba(37,211,102,0.45);
    animation: waPulse 2.5s ease infinite;
    transition: transform 0.2s;
  }

  .wa-fab:hover { transform: scale(1.12); }

  @keyframes waPulse {
    0%, 100% { box-shadow: 0 6px 20px rgba(37,211,102,0.45); }
    50%       { box-shadow: 0 6px 30px rgba(37,211,102,0.65); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ══ HAMBURGER BUTTON ══ */
  .nav-hamburger {
    display: none;
    flex-direction: column; justify-content: center; gap: 5px;
    background: none; border: none; cursor: pointer;
    padding: 0.4rem; z-index: 201;
  }
  .nav-hamburger span {
    display: block; width: 24px; height: 2px;
    background: var(--white); border-radius: 2px;
    transition: all 0.3s;
  }
  .nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
